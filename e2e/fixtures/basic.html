<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redline fixture</title>
<style>
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; color: #222; background: #fafafa; }
  main { width: 820px; padding: 24px; }
  h1 { font-size: 32px; margin: 0 0 8px; }
  .lead { color: #555; margin: 0 0 16px; }
  #btn { padding: 8px 16px; font-size: 16px; }
  #link { margin-left: 16px; }
  #list { margin: 16px 0; padding: 0; list-style: none; width: 300px; }
  #list li { padding: 8px 12px; border: 1px solid #ccc; background: #fff; }
  #row { display: flex; gap: 12px; margin: 16px 0; padding: 8px; border: 1px dashed #999; }
  .card { width: 120px; height: 70px; background: #dde; padding: 8px; box-sizing: border-box; }
  #empty { min-height: 70px; border: 2px dashed #c66; margin: 16px 0; padding: 4px; }
  #scroller { width: 400px; height: 120px; overflow: auto; border: 2px solid #3a3; margin: 16px 0; }
  #scroller .inner { height: 600px; padding: 8px; }
  #scroller .item { margin: 0 0 20px; padding: 6px; background: #efe; }
  #spacer { height: 1600px; }
</style>
</head>
<body>
<main id="main">
  <h1 id="title">Welcome to Redline</h1>
  <p class="lead">Edit this page visually.</p>
  <p id="styled" style="color: blue; margin: 0">Inline styled</p>
  <button id="btn" type="button">Click me</button><a id="link" href="/linked.html">A link</a>
  <ul id="list"><li>Alpha</li><li>Bravo</li><li>Charlie</li></ul>
  <div id="row"><div class="card" id="c1">One</div><div class="card" id="c2">Two</div><div class="card" id="c3">Three</div></div>
  <div id="empty"></div>
  <div id="scroller"><div class="inner"><p class="item" id="s1">Scroll item 1</p><p class="item" id="s2">Scroll item 2</p><p class="item" id="s3">Scroll item 3</p><p class="item" id="s4">Scroll item 4</p><p class="item" id="s5">Scroll item 5</p></div></div>
  <div id="spacer"></div>
  <p id="bottom">Bottom of page</p>
</main>
<script>
  window.__log = []
  document.getElementById("btn").addEventListener("click", () => window.__log.push("btn-click"))
  document.getElementById("link").addEventListener("click", () => window.__log.push("link-click"))
  document.addEventListener("click", (e) => window.__log.push("doc-click:" + (e.target.id || e.target.localName)))
  document.addEventListener("keydown", (e) => window.__log.push("keydown:" + e.key))
</script>
</body>
</html>
